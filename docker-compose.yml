services:
  mongodb:
    image: mongo:7.0
    container_name: campusvoice-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: college_cms
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - campusvoice_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo-express:
    image: mongo-express:latest
    container_name: campusvoice-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/college_cms?authSource=admin
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - campusvoice_network

  media-server:
    image: nginx:alpine
    container_name: campusvoice-media-server
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - media_data:/usr/share/nginx/html/uploads
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - campusvoice_network

volumes:
  mongodb_data:
    name: campusvoice_mongodb_data
  media_data:
    name: campusvoice_media_data

networks:
  campusvoice_network:
    name: campusvoice_network
    driver: bridge
