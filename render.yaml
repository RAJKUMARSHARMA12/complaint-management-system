# ==============================================================================
# CampusVoice Cloud Deployment Blueprint (Render.com)
# All-in-One Docker Web Service (Node.js REST API + Embedded MongoDB Server)
# ==============================================================================
services:
  - type: web
    name: campusvoice-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "10000"
      - key: MONGO_URI
        value: "mongodb://127.0.0.1:27017/college_cms"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: LOGIN_RATE_LIMIT_MAX
        value: "5"
      - key: API_RATE_LIMIT_MAX
        value: "100"
      - key: STORAGE_TYPE
        value: "local"
